<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="jt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1020" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="jt-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.7" />
    </linearGradient>

    <!-- T-Bar Gradient -->
    <linearGradient id="jt-tbar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- J-Stem Gradient -->
    <linearGradient id="jt-jstem" x1="50%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="35%" stop-color="#3b82f6" />
      <stop offset="75%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Ambient Glow -->
    <filter id="jt-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Badge with Rounded Corners -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#jt-bg)" />
  <rect x="4" y="4" width="120" height="120" rx="28" fill="none" stroke="url(#jt-border)" stroke-width="2.5" />

  <!-- Ambient Internal Glow -->
  <circle cx="64" cy="42" r="30" fill="#3b82f6" opacity="0.2" filter="url(#jt-glow)" />

  <!-- The T Bar: Horizontal sleek tech beam -->
  <rect x="28" y="32" width="72" height="14" rx="7" fill="url(#jt-tbar)" />

  <!-- The J Stem and Hook: Descends from the T and curves up left -->
  <path
    d="M64 38 V74 C64 88 52 96 40 96 C29 96 24 86 24 76"
    fill="none"
    stroke="url(#jt-jstem)"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Emerald Pulse / Innovation Node -->
  <circle cx="92" cy="74" r="9" fill="#10b981" opacity="0.22" />
  <circle cx="92" cy="74" r="5.5" fill="#10b981" />
  <circle cx="92" cy="74" r="2.2" fill="#a7f3d0" />
</svg>
